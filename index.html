<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Inkwell</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #121214;
        --panel: #1b1b1f;
        --line: #2d2d34;
        --text: #ececf1;
        --muted: #9a9aa6;
        --accent: #e8203a;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: 100dvh; /* the part a phone's toolbars leave visible */
        background: var(--bg);
        color: var(--text);
        font: 13px/1.4 system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      header,
      footer {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 14px;
        padding: 8px max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left));
        background: var(--panel);
        border: 0 solid var(--line);
      }
      header {
        border-bottom-width: 1px;
        padding-top: max(8px, env(safe-area-inset-top)); /* clear of an iPhone's notch */
      }
      footer {
        border-top-width: 1px;
        padding-bottom: max(8px, env(safe-area-inset-bottom)); /* and of its home bar */
      }
      button,
      input,
      select,
      .button {
        touch-action: manipulation; /* no double-tap zoom on controls */
      }
      .brand {
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .spacer {
        flex: 1;
      }
      #clip-info,
      #status,
      output {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      #timing-note {
        color: #e0b45a;
      }
      button,
      .button,
      select {
        font: inherit;
        color: var(--text);
        text-decoration: none;
        background: #2a2a31;
        border: 1px solid #3a3a43;
        border-radius: 6px;
        padding: 5px 10px;
        cursor: pointer;
      }
      select {
        padding: 4px 6px;
      }
      button:disabled,
      .button:has(input:disabled) {
        opacity: 0.45;
        cursor: default;
      }
      #stage {
        position: relative;
        display: grid;
        place-items: center;
        min-height: 0;
        overflow: hidden;
        padding: 12px;
      }
      #view {
        touch-action: none;
        cursor: crosshair;
        background: #000;
        box-shadow: 0 0 0 1px var(--line);
      }
      #drop {
        position: absolute;
        inset: 12px;
        display: grid;
        place-content: center;
        gap: 4px;
        text-align: center;
        color: var(--muted);
        border: 2px dashed var(--line);
        border-radius: 12px;
      }
      #drop.over {
        border-color: var(--accent);
        color: var(--text);
      }
      #scrub {
        flex: 1;
        min-width: 160px;
      }
      .group {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .swatch {
        appearance: none;
        width: 22px;
        height: 22px;
        margin: 0;
        border-radius: 50%;
        background: var(--color);
        box-shadow: inset 0 0 0 1px #ffffff40;
        cursor: pointer;
      }
      .swatch:checked {
        outline: 2px solid var(--text);
        outline-offset: 2px;
      }
      /* Phones: tighter rows, so the video gets the room. */
      /* The plan: out of the grid, over the stage. A sheet from the bottom on a
         phone (below), a column on the right otherwise. */
      #plan-panel {
        position: fixed;
        z-index: 2;
        right: 0;
        top: 56px;
        bottom: 56px;
        width: min(320px, 100vw);
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 10px 12px;
        background: var(--panel);
        border-left: 1px solid var(--line);
        -webkit-user-select: text;
        user-select: text;
      }
      #plan-panel[hidden] {
        display: none;
      }
      .plan-head {
        margin: 0 0 8px;
        font-weight: 600;
      }
      .plan-note {
        margin: 0 0 8px;
        padding: 6px 8px;
        border: 1px solid var(--accent);
        border-radius: 6px;
      }
      .plan-row {
        padding: 8px 0;
        border-top: 1px solid var(--line);
      }
      .plan-row h3 {
        margin: 0 0 6px;
        font-size: 13px;
      }
      .plan-row h3::before {
        content: '';
        display: inline-block;
        width: 10px;
        height: 10px;
        margin-right: 6px;
        border-radius: 50%;
        background: var(--stroke);
      }
      .plan-field {
        display: grid;
        grid-template-columns: 64px 1fr 28px;
        align-items: center;
        gap: 6px;
        min-height: 36px; /* a finger's worth */
      }
      .plan-field span {
        color: var(--muted);
      }
      .plan-dot {
        grid-column: 3;
        padding: 0;
        min-width: 28px;
        min-height: 28px;
        color: var(--accent);
        background: none;
        border: 0;
        font-size: 20px;
      }
      .plan-reason {
        margin: 6px 0 0;
        color: var(--muted);
      }
      @media (max-width: 600px) {
        #plan-panel {
          top: auto;
          left: 0;
          width: auto;
          max-height: 45dvh;
          border-left: 0;
          border-top: 1px solid var(--line);
          padding-bottom: max(10px, env(safe-area-inset-bottom));
        }
        body {
          font-size: 12px;
        }
        header,
        footer {
          gap: 6px 10px;
        }
        button,
        .button,
        select {
          padding: 5px 8px;
        }
        #clip-info,
        .spacer,
        .size-word {
          display: none;
        }
        #status,
        #timing-note {
          order: 1; /* its own line, under the buttons */
          flex-basis: 100%;
        }
        #stage {
          padding: 6px;
        }
        #scrub {
          min-width: 0;
        }
        #size {
          width: 64px;
        }
        .swatch {
          width: 20px;
          height: 20px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">Inkwell</span>
      <label class="button">Open clip<input id="file" type="file" accept="video/*" hidden /></label>
      <span id="clip-info"></span>
      <button id="track" hidden disabled>Track (stand-in)</button>
      <div id="tracking-controls" class="group" hidden>
        <label class="group"
          >Follow
          <select id="follow">
            <option value="points">body points</option>
            <option value="mask">body mask, like SAM</option>
          </select>
        </label>
        <label class="group"><input id="show-tracking" type="checkbox" />Show tracking</label>
      </div>
      <span class="spacer"></span>
      <span id="timing-note"></span>
      <span id="status"></span>
      <button id="export" disabled>Export MP4</button>
      <a id="download" class="button" hidden>Download</a>
    </header>

    <aside id="plan-panel" hidden aria-label="Plan"></aside>
    <main id="stage">
      <canvas id="view" hidden></canvas>
      <div id="drop">
        <strong>Drop a clip here, or use Open clip</strong>
        <span>It's converted to H.264 at 30 fps first (up to 15 s).</span>
      </div>
    </main>

    <footer>
      <button id="play" disabled>Play</button>
      <input id="scrub" type="range" min="0" max="0" value="0" disabled />
      <output id="frame-label">frame –</output>
      <div class="group" role="radiogroup" aria-label="Ink color">
        <input class="swatch" type="radio" name="color" value="#e8203a" style="--color: #e8203a" aria-label="Red" checked />
        <input class="swatch" type="radio" name="color" value="#f4f1ea" style="--color: #f4f1ea" aria-label="White" />
        <input class="swatch" type="radio" name="color" value="#16141a" style="--color: #16141a" aria-label="Black" />
      </div>
      <div class="group" role="radiogroup" aria-label="Layer for new strokes">
        <span class="layer-word">New strokes:</span>
        <label class="group"><input type="radio" name="layer" value="front" checked />Front</label>
        <label class="group"><input type="radio" name="layer" value="behind" />Behind</label>
      </div>
      <label class="group" aria-label="Brush"
        ><span class="size-word">Brush</span>
        <select id="brush">
          <option value="ink" selected>Ink</option>
          <option value="textured">Textured</option>
          <option value="fine-ink">Fine ink</option>
          <option value="fine-textured">Fine textured</option>
          <option value="neon-straight">Neon, flat ends</option>
          <option value="neon-round">Neon, round ends</option>
        </select></label
      >
      <label class="group" aria-label="Brush size"
        ><span class="size-word">Size</span> <input id="size" type="range" min="4" max="96" value="28" /><output id="size-value">28</output></label
      >
      <label class="group" aria-label="Stiffness of new strokes" title="0 hangs like a rope, 1 keeps the drawn shape"
        ><span class="size-word">Stiff</span> <input id="stiffness" type="range" min="0" max="100" value="50" /><output id="stiffness-value"
          >0.50</output
        ></label
      >
      <label class="group" title="New strokes follow the body exactly, like horns or a halo"><input id="rigid" type="checkbox" />Rigid</label>
      <label class="group"><input id="wobble" type="checkbox" checked />Wobble</label>
      <button id="undo" disabled>Undo</button>
      <button id="clear" disabled>Clear</button>
      <button id="plan" disabled title="Wonder reads the strokes on this frame: what each attaches to and how it moves">Plan</button>
      <button id="save-effect" disabled title="The effect JSON, with your changes to the plan">Save effect</button>
      <button id="save-drawings" disabled title="Your strokes by frame, for recording Wonder's plan (npm run plan:record)">Save drawings</button>
      <button id="raw-strokes" disabled title="Your strokes exactly as drawn, for reference/raw-strokes.json">Save strokes</button>
    </footer>

    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
